name: Docker Image

on:
  workflow_run:
    workflows: ["Bash Syntax Check & Lint"]
    types:
      - completed
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dotfiles
  # Only publish from the default branch or version tags
  PUSH: ${{ github.event.workflow_run.head_branch == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v') }}
  # Shared by both metadata steps so the version label matches the tags
  METADATA_TAGS: |
    # Tag with 'latest' on main branch pushes
    type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # Tag with version on git tags (e.g., v1.2.3 -> 1.2.3)
    type=semver,pattern={{version}}
    # Tag with major.minor on git tags (e.g., v1.2.3 -> 1.2)
    type=semver,pattern={{major}}.{{minor}}
    # Tag with major on git tags (e.g., v1.2.3 -> 1)
    type=semver,pattern={{major}}

jobs:
  # Build each platform on a native runner: under QEMU, arm64 builds took over
  # an hour and newer Node releases crash
  build:
    # Run if triggered by successful workflow_run OR by tag push
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # workflow_run-triggered runs default to checking out the default branch;
      # use the SHA from the originating workflow so we test the actual branch
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Label the checked-out commit, not the default branch HEAD that
      # workflow_run's github.sha points to (`context: git` can't infer a ref
      # from the detached checkout)
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.METADATA_TAGS }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      # Push by digest only; the merge job tags the multi-platform manifest
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: ${{ env.PUSH == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    # Same condition as PUSH (env isn't available in job-level `if`)
    if: ${{ github.event.workflow_run.head_branch == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.METADATA_TAGS }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::No image tags generated"
            exit 1
          fi
          digests=(*)
          docker buildx imagetools create "${tags[@]}" "${digests[@]/#/${IMAGE}@sha256:}"

      - name: Run dotfiles health check
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --platform linux/amd64 "${IMAGE}:${VERSION}" ./dotfiles/script/check_health
