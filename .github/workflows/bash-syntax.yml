name: Bash Syntax Check & Lint

# Config-only changes don't trigger this (or the Docker build that follows it).
# Stowed shell files are checked out so they're linted whenever this runs.
on:
  push:
    paths:
      - 'script/**'
      - 'Makefile'
      - '.github/workflows/**'

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout (script/, stowed-files/ and Makefile only)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            script
            stowed-files
            Makefile
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Run all checks (lint + format)
        run: |
          make test
