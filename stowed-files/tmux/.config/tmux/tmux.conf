# vim:fdm=marker et fdl=2 sts=2 sw=2 ts=2

# Use current directory when creating new panes & windows
bind-key -N "Create new window" c new-window -c "#{pane_current_path}"
bind-key -N "Split window vertically (top/bottom)" '"' split-window -c "#{pane_current_path}"
bind-key -N "Split window horizontally (left/right)" % split-window -h -c "#{pane_current_path}"

# Custom Keybindings {{{

# Swap windows via Alt-<number>, similar to browser tabs in Firefox
bind-key -N "Swap to window 1" -n M-1 select-window -T -t 1
bind-key -N "Swap to window 2" -n M-2 select-window -T -t 2
bind-key -N "Swap to window 3" -n M-3 select-window -T -t 3
bind-key -N "Swap to window 4" -n M-4 select-window -T -t 4
bind-key -N "Swap to window 5" -n M-5 select-window -T -t 5
bind-key -N "Swap to window 6" -n M-6 select-window -T -t 6
bind-key -N "Swap to window 7" -n M-7 select-window -T -t 7
bind-key -N "Swap to window 8" -n M-8 select-window -T -t 8
bind-key -N "Swap to window 9" -n M-9 select-window -T -t 9

# Reload config via 'r' (also refresh-client, since that's default binding)
bind-key -N "Reload Configuration" r {
  source-file ~/.config/tmux/tmux.conf;
  refresh-client;
  display-message "Config reloaded"
}
# Shortcut to bind to main-vertical layout via 'R' (unbound by default)
bind-key -N "Select main-vertical layout" R select-layout main-vertical

# Toggle a floating terminal, backed by a persistent session so it keeps state
# between toggles. Lives on a separate `console` server so it doesn't show up
# in session lists or get picked by a plain `tmux attach` (note that `tmux`
# commands run inside it target the console server). Starts in the current
# directory when first opened. The console server may have been started from
# a different environment (or by an earlier server), so copy its prefix over
# each time it opens -- the value, not the prefix-*.conf files, so a prefix
# that isn't C-a/C-b/C-g works too. It also detects its environment once at
# startup (see below), so hand it this server's SSH_CONNECTION rather than the
# one from whichever client happens to be attached, otherwise opening it first
# over SSH would stick it with the forwarded agent
bind-key -N "Toggle console" "`" {
  if-shell -F '#{m:*/console,#{socket_path}}' {
    detach-client
  } {
    display-popup -T "#[fg=cyan] console" -w 80% -h 80% -d "#{pane_current_path}" \
      -E 'p=$(tmux show-options -gv prefix); c=$(tmux show-environment -g SSH_CONNECTION 2>/dev/null | sed -n "s/^SSH_CONNECTION=//p"); env -u TMUX -u TMUX_PANE SSH_CONNECTION="$c" tmux -L console new-session -A -s console \; set-option -t console status off \; set-option -g prefix "$p" \; bind-key -N "Send prefix" "$p" send-prefix'
  }
}

# Move window index via P/N
bind-key -N "Move window to previous" -r P swap-window -d -t -1
bind-key -N "Move window to next" -r N swap-window -d -t +1

# Select prefix, via `prefix-menu` command alias. Uses a fixed index past the
# defaults so reloading the config overwrites it instead of adding duplicates.
# Bindings expand the alias when they're created, so it must come first, and
# later changes to it (e.g. in ~/.tmux.conf.local) only apply if they rebind
set-option -s command-alias[100] "prefix-menu=display-menu -T Prefix -x P -y P \
  C-a a 'source-file -q ~/.config/tmux/tmux.prefix-a.conf' \
  C-b b 'source-file -q ~/.config/tmux/tmux.prefix-b.conf' \
  C-g g 'source-file -q ~/.config/tmux/tmux.prefix-g.conf'"
bind-key -N "Select prefix key" G prefix-menu
bind-key -N "Select prefix key" -Troot MouseUp1StatusLeft prefix-menu

# }}}

# Detect environment once, when the server starts. When the config is
# reloaded, if-shell also sees the current session's environment (e.g.
# SSH_CONNECTION from a client that attached over SSH), which would otherwise
# flip settings depending on where the reload came from
if-shell -F '#{==:#{@is_ssh},}' {
  set-option -g @is_ssh 0
  set-option -g @is_nested 0
  set-option -g @use_stable_agent 0
  if-shell 'test -n "${SSH_CONNECTION}"' {
    set-option -g @is_ssh 1
  }
  # SSH and Docker are likely to be nested inside another tmux
  if-shell 'test -n "${SSH_CONNECTION}" || test -n "${IS_DOCKER}"' {
    set-option -g @is_nested 1
  }
  # Eternal terminal works over SSH connection, but we still want the local
  # agent, so only use the forwarded agent's stable path for plain SSH
  if-shell 'test -n "${SSH_CONNECTION}" && test -z "${ET_VERSION}" && test -n "${SSH_AUTH_SOCK}"' {
    set-option -g @use_stable_agent 1
  }
}

# Start window/pane numbering at 1 instead of 0
set-option -g base-index 1
set-option -g pane-base-index 1

# Use full true color & italics in the terminal
set-option -g default-terminal "tmux-256color"
# Reset first so reloading the config doesn't add duplicates
set-option -su terminal-features
# Ghostty also supports: modified keys, OSC 8 hyperlinks, colored undercurl
# (for diagnostics), and synchronized updates
set-option -sa terminal-features ',xterm-ghostty:RGB:extkeys:hyperlinks:usstyle:sync,xterm-256color:RGB'
# Nested tmux (over SSH, console popup) only detects extkeys itself in 3.7+
set-option -sa terminal-features ',tmux*:extkeys'

# Pass modified keys like S-Enter and C-S-a through to apps that request them.
# Clients only pick up changes to this when attaching, not on config reload
set-option -s extended-keys on
set-option -s extended-keys-format csi-u

# Allow passthrough for stuff like setting terminal colors, clipboard
set-option -g allow-passthrough on

# Be brief with messages
set-option -g display-time 1000

# Enable focus events, helps with `autoread` in vim
set-option -g focus-events on

# Keep more terminal output
set-option -g history-limit 100000

# Enable mouse support
set-option -g mouse on

# Use vi keys in copy mode (tmux infers this from $EDITOR, but be explicit)
set-option -g mode-keys vi

# Jump between shell prompts in copy mode (requires OSC 133 marks from shell)
bind-key -N "Jump to previous prompt" -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -N "Jump to next prompt" -T copy-mode-vi ] send-keys -X next-prompt

# Secondary panes should be smaller
set-option -g other-pane-height 20
set-option -g other-pane-width 80

# Renumber when closing windows
set-option -g renumber-windows on

# Set terminal title, prefixed with the hostname when over SSH
set-option -g set-titles on
set-option -g set-titles-string "#{?#{@is_ssh},#{host_short}: ,}#W [#I]"

# No beeping, ever: show a message instead of passing the bell to the terminal
# (window still gets flagged in the status bar). Ignore bells in the current
# window, e.g. failed tab completion
set-option -g visual-bell on
set-option -g bell-action other

# Allow setting clipboard via OSC52 sequence
set-option -g set-clipboard on

# Message Command Bar {{{

# Default background instead of jarring yellow
set-option -g message-style fg=cyan

# }}}

# Status Bar {{{

# Default text and background
set-option -g status-style bg=colour235,fg=default,dim
if-shell 'test "${COLOR_THEME:-}" = "light"' {
  set-option -g status-style bg=colour254,fg=default,dim
}
set-option -g status-justify left

# Clear default status before adding
set-option -g status-left ''
set-option -g status-right ''

# Terse listing
set-option -g window-status-format "  #[fg=yellow,dim]#I#{?window_flags,#{window_flags},#[fg=default]:}#[fg=default]#W#[default]  "
set-option -g window-status-current-format "  #[fg=yellow,bright]#I#[default]#F#[fg=white,bright]#W#[fg=default]  "
set-option -g window-status-current-style bg=black,bright
set-option -g window-status-bell-style underscore
set-option -g window-status-separator ''

# Indicate prefix and when activated
set-option -ga status-left '#{?client_prefix,#[bg=white fg=brightcyan reverse bright] #{prefix} #[bg=default default], #[dim]#{prefix}#[default] }'

set-option -g status-right-length 100
set-option -g status-right-style dim
# Current music, if applicable
set-option -ga status-right "#[fg=colour243, italics]#(tmux-music-status)#[fg=default,default]"
# Hostname when using SSH, date otherwise
if-shell -F '#{@is_ssh}' {
  set-option -ga status-right "#[fg=blue]#{p14:host_short}#[fg=default] "
} {
  set-option -ga status-right "%d-%m "
}
# Time
set-option -ga status-right '%R'
# }}}

# Update when creating or attaching. TERM/TERM_PROGRAM let tools like Yazi
# detect the outer terminal's graphics protocol through tmux passthrough.
# Append to the defaults (DISPLAY, SSH_CONNECTION, etc) instead of replacing
# them, resetting first so reloading the config doesn't add duplicates
set-option -gu update-environment
set-option -ga update-environment "TERM TERM_PROGRAM"

# Tweak some behaviors when likely to be nested (SSH or Docker)
if-shell -F '#{@is_nested}' {
  # Use a different prefix in order to make nesting easier
  source-file -q ~/.config/tmux/tmux.prefix-a.conf

  # Distinguish bottom border
  set-option -g status-bg colour236

  # Adjust prefix display color, clearing out the old one
  set-option -g status-left '#{?client_prefix,#[fg=brightgreen reverse] #{prefix} #[bg=default default], #[dim]#{prefix}#[default] }'
}

if-shell -F '#{@use_stable_agent}' {
  # Use consistently named agent forwarding path (symlink maintained by
  # ~/.ssh/rc) for easy resuming without breaking existing shells. Keep
  # SSH_AUTH_SOCK out of update-environment, otherwise attaching copies the
  # connection-specific path into the session environment, overriding this.
  # Its index in the default list varies between versions, so look it up
  run-shell 'i=$(tmux show-options -g update-environment | sed -n "s/^update-environment.\([0-9]*\). SSH_AUTH_SOCK$/\1/p"); test -z "$i" || tmux set-option -gu "update-environment[$i]"'
  set-environment -g SSH_AUTH_SOCK ~/.ssh/ssh_auth_sock
}

# Music control, when available
if-shell 'command -v cmus-remote' {
  # Pause music via 'u', or click on right status
  bind-key -N "Pause music" u {
    run-shell -b "cmus-remote --pause"
  }
  bind-key -N "Pause music" -Troot MouseUp1StatusRight {
    run-shell -b "cmus-remote --pause"
  }

  # Music menu via 'U' or right click on right status
  bind-key -N "Show music menu" U {
    run-shell -b "tmux-music-menu"
  }
  bind-key -N "Show music menu" -Troot MouseUp3StatusRight {
    run-shell -b "tmux-music-menu"
  }
}

# Local config {{{
source-file -q ~/.tmux.conf.local
# }}}
