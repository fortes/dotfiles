# Scrobbles MPD plays. Holds credentials, so edits stay local:
# script/lock_local_files marks this file skip-worktree. Paths must be
# absolute, since mpdscribble doesn't expand `~`
log = /Users/fortes/.mpdscribble/mpdscribble.log
verbose = 1

# The password can be its MD5: printf %s "$LIBRE_FM_PASSWORD" | md5 -q
[libre.fm]
url = https://turtle.libre.fm/
username = fortes
password = xxxxxx
journal = /Users/fortes/.mpdscribble/librefm.journal

# Password is the user token from https://listenbrainz.org/settings/
[listenbrainz]
url = http://proxy.listenbrainz.org/
username = fortes
password = xxxxxx
journal = /Users/fortes/.mpdscribble/listenbrainz.journal
