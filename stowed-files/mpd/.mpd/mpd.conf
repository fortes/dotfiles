# Library from the server's MPD, audio plays here. Only local clients
# control this player. local_music.conf is the offline alternative, started
# by mpd-offline
bind_to_address "localhost"
zeroconf_enabled "no"
state_file "~/.mpd/state"
# Saved playlists stay on this machine, since the proxy database doesn't
# share them. Offline mode uses them too
playlist_directory "~/.mpd/playlists"

# The server's database and music files
include "mpd.conf.local"

audio_output {
    type "osx"
    name "CoreAudio"
    # The hardware mixer sets the volume of whichever device was default
    # when mpd started, not the one currently playing (e.g. Bluetooth)
    mixer_type "software"
}
replaygain "album"
