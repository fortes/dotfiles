# Offline alternative to mpd.conf, started by mpd-offline: plays the albums
# on this Mac instead of the server's. Same port, so clients don't notice
bind_to_address "localhost"
zeroconf_enabled "no"
# Separate from the server's, so its queue is still there when switching back
state_file "~/.mpd/local_music.state"
db_file "~/.mpd/local_music.db"
# Shared with the server's MPD: songs here have the same paths
playlist_directory "~/.mpd/playlists"

# ~/Music rather than ~/Music/albums, so song paths match the server's
# (albums/...) and playlists and play-albums work for whatever's local.
# ~/Music/.mpdignore skips Apple Music's library, and the link to the
# server's share points outside, so it's skipped too
music_directory "~/Music"
follow_outside_symlinks "no"

audio_output {
    type "osx"
    name "CoreAudio"
    # See mpd.conf
    mixer_type "software"
}
replaygain "album"
